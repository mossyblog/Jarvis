# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15  # Reduced timeout since tests should complete quickly

    env:
      TEST_DATABASE_URL: "Host=localhost;Port=5432;Database=jarvis_test;Username=postgres;Password=postgres;Command Timeout=30;Timeout=30;Pooling=false"
      SUPABASE_ADMIN_URL: "Host=localhost;Port=5432;Database=jarvis_test;Username=postgres;Password=postgres;Command Timeout=30;Timeout=30;Pooling=false"

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Start Docker services
      run: |
        # Start PostgreSQL without restart policy for CI (prevents crash loops)
        docker compose up -d postgres

        # Disable restart policy for CI environment
        docker update --restart=no jarvis-postgres || true

        # Wait for PostgreSQL to be ready AND init scripts to complete
        echo "Waiting for PostgreSQL to be ready..."
        for i in {1..90}; do
          # Check if container is running (not restarting)
          CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' jarvis-postgres 2>/dev/null || echo "not_found")
          if [ "$CONTAINER_STATUS" != "running" ]; then
            echo "Container status: $CONTAINER_STATUS - waiting... ($i/90)"
            sleep 2
            continue
          fi

          # Check if postgres is accepting connections
          if docker compose exec -T postgres pg_isready -U postgres 2>/dev/null; then
            # Verify init scripts completed by checking for our tables
            if docker compose exec -T postgres psql -U postgres -d jarvis_test -c "\dt" 2>/dev/null | grep -q "account_component"; then
              echo "PostgreSQL is ready and initialized"
              break
            fi
          fi

          echo "Waiting for PostgreSQL initialization... ($i/90)"
          sleep 2
        done

        # Final verification
        echo "Verifying database setup..."
        docker compose exec -T postgres psql -U postgres -d jarvis_test -c "\dt" | grep -E "(account_component|auth_token_component|audit_event_component)" || {
          echo "Database verification failed. Container logs:"
          docker compose logs postgres
          exit 1
        }
        echo "Docker-based database initialization complete"
    - name: Restore dependencies
      run: dotnet restore Jarvis.sln
      env:
        MSBUILDDISABLENODEREUSE: "1"
    - name: Build
      run: dotnet build Jarvis.sln --no-restore
      env:
        MSBUILDDISABLENODEREUSE: "1"
    - name: Test
      run: |
        # Run tests (excluding timing-sensitive tests that can hang in CI)
        # Temporarily removed --collect:"XPlat Code Coverage" to debug hanging issue
        dotnet test Jarvis.sln --no-build --verbosity minimal --settings test.runsettings --logger "console;verbosity=minimal" --logger "trx;LogFileName=test-results.trx" --filter "DisplayName!~AddRandomDelay&DisplayName!~ConstantTimeEquals&DisplayName!~ExecuteWithMinimumTime&DisplayName!~AuthenticationSimulation&DisplayName!~Authentication_MustResistTimingAttacks&DisplayName!~SecureComparison_MustBeConstantTime" --blame-hang-timeout 5m --blame-hang-dump-type none
      env:
        TEST_DATABASE_URL: "Host=localhost;Port=5432;Database=jarvis_test;Username=postgres;Password=postgres;Command Timeout=30;Timeout=30;Pooling=false"
        ASPNETCORE_ENVIRONMENT: "Test"
        MSBUILDDISABLENODEREUSE: "1"
    - name: Cleanup Docker services
      if: always()
      run: |
        # Clean up Docker services
        docker compose down -v
        docker system prune -f
    # - name: Upload coverage reports to Codecov
    #   uses: codecov/codecov-action@v3
    #   with:
    #     token: ${{ secrets.CODECOV_TOKEN }}
    # Temporarily disabled while debugging hanging issue
