# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30  # Add overall job timeout

    services:
      postgres:
        image: supabase/postgres:15.1.0.155
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: "Host=localhost;Port=5432;Database=jarvis_test;Username=postgres;Password=postgres;Command Timeout=30;Timeout=30;MaxPoolSize=50"
      SUPABASE_ADMIN_URL: "Host=localhost;Port=5432;Database=jarvis_test;Username=supabase_admin;Password=postgres;Command Timeout=30;Timeout=30;MaxPoolSize=50"

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
    - name: Initialize Test Database
      run: |
        # Wait for PostgreSQL to be ready
        for i in {1..30}; do
          if pg_isready -h localhost -p 5432 -U postgres; then
            echo "PostgreSQL is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 1
        done
        
        # Run the setup script
        PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d jarvis_test -f core.jarvis.tests/Scripts/setup-test-database.sql
        
        # Create GraphQL wrapper function as supabase_admin
        PGPASSWORD=postgres psql -h localhost -p 5432 -U supabase_admin -d jarvis_test -f core.jarvis.tests/Scripts/setup-graphql-wrapper.sql
        
        # Also ensure tables have all required columns (in case of schema changes)
        echo "Tables created successfully"
        
        # Verify setup
        echo "Verifying database setup..."
        PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d jarvis_test -c "\dt" | grep -E "(users|security_token|audit_event)" || exit 1
        echo "Database initialization complete"
      env:
        PGPASSWORD: postgres
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      timeout-minutes: 8  # Hard timeout for entire step
      run: |
        # Run tests with timeout and force exit
        timeout 420 dotnet test --no-build --verbosity minimal --settings test.runsettings --logger "console;verbosity=minimal" --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" || EXIT_CODE=$?
        
        # Kill any lingering dotnet processes
        pkill -f "dotnet" || true
        sleep 1
        pgrep -f "dotnet" | xargs -r kill -9 || true
        
        echo "Tests completed with exit code: ${EXIT_CODE:-0}"
        exit ${EXIT_CODE:-0}
      env:
        TEST_DATABASE_URL: "Host=localhost;Port=5432;Database=jarvis_test;Username=postgres;Password=postgres;Command Timeout=30;Timeout=30;MaxPoolSize=50"
        ASPNETCORE_ENVIRONMENT: "Test"
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
