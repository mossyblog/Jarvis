name: E2E Tests

on:
  push:
    branches: [ main, master, develop, feature/* ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'core.jarvis.ui.studio/package-lock.json'
          
      - name: Install dependencies
        working-directory: core.jarvis.ui.studio
        run: npm ci
        
      - name: Install Playwright browsers
        working-directory: core.jarvis.ui.studio
        run: npx playwright install --with-deps ${{ matrix.browser }}
        
      - name: Build application
        working-directory: core.jarvis.ui.studio
        run: npm run build
        
      - name: Run E2E tests
        working-directory: core.jarvis.ui.studio
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.browser }}
          path: core.jarvis.ui.studio/test-results/
          retention-days: 7
          
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: core.jarvis.ui.studio/playwright-report/
          retention-days: 7

  mobile-tests:
    name: Mobile E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'core.jarvis.ui.studio/package-lock.json'
          
      - name: Install dependencies
        working-directory: core.jarvis.ui.studio
        run: npm ci
        
      - name: Install Playwright browsers
        working-directory: core.jarvis.ui.studio
        run: npx playwright install --with-deps chromium
        
      - name: Build application
        working-directory: core.jarvis.ui.studio
        run: npm run build
        
      - name: Run mobile E2E tests
        working-directory: core.jarvis.ui.studio
        run: npm run test:e2e:mobile
        env:
          CI: true
          
      - name: Upload mobile test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-mobile-results
          path: core.jarvis.ui.studio/test-results/
          retention-days: 7

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'core.jarvis.ui.studio/package-lock.json'
          
      - name: Install dependencies
        working-directory: core.jarvis.ui.studio
        run: npm ci
        
      - name: Install Playwright browsers
        working-directory: core.jarvis.ui.studio
        run: npx playwright install --with-deps chromium
        
      - name: Build application
        working-directory: core.jarvis.ui.studio
        run: npm run build
        
      - name: Run accessibility tests
        working-directory: core.jarvis.ui.studio
        run: npm run test:e2e:accessibility
        env:
          CI: true
          
      - name: Upload accessibility results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-accessibility-results
          path: core.jarvis.ui.studio/test-results/
          retention-days: 7

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'core.jarvis.ui.studio/package-lock.json'
          
      - name: Install dependencies
        working-directory: core.jarvis.ui.studio
        run: npm ci
        
      - name: Install Playwright browsers
        working-directory: core.jarvis.ui.studio
        run: npx playwright install --with-deps chromium
        
      - name: Build application
        working-directory: core.jarvis.ui.studio
        run: npm run build
        
      - name: Run performance tests
        working-directory: core.jarvis.ui.studio
        run: npm run test:e2e:performance
        env:
          CI: true
          
      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-performance-results
          path: core.jarvis.ui.studio/test-results/
          retention-days: 7

  visual-regression-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'core.jarvis.ui.studio/package-lock.json'
          
      - name: Install dependencies
        working-directory: core.jarvis.ui.studio
        run: npm ci
        
      - name: Install Playwright browsers
        working-directory: core.jarvis.ui.studio
        run: npx playwright install --with-deps chromium
        
      - name: Build application
        working-directory: core.jarvis.ui.studio
        run: npm run build
        
      - name: Run visual regression tests
        working-directory: core.jarvis.ui.studio
        run: npm run test:e2e:visual
        env:
          CI: true
          
      - name: Upload visual test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-visual-results
          path: core.jarvis.ui.studio/test-results/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests, mobile-tests, accessibility-tests, performance-tests, visual-regression-tests]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Generate test summary
        run: |
          echo "# E2E Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Status" >> $GITHUB_STEP_SUMMARY
          echo "- **E2E Tests**: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Mobile Tests**: ${{ needs.mobile-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Accessibility Tests**: ${{ needs.accessibility-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance Tests**: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Visual Regression Tests**: ${{ needs.visual-regression-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Test results and reports are available in the workflow artifacts." >> $GITHUB_STEP_SUMMARY